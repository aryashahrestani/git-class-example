<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مشاهده مقاله</title>

<style>

*{
    box-sizing:border-box;
    font-family:Tahoma;
}

body{
    background:#f5f6fa;
    margin:0;
    padding:30px;
}


.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:12px;
    padding:30px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}


/* عنوان */

.title{
    font-size:28px;
    color:#2c3e50;
    margin-bottom:15px;
}


.meta{
    color:#888;
    font-size:14px;
    margin-bottom:25px;
}


.cover{

    width:100%;
    height:350px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:25px;

}



.summary{

    background:#f8f9fa;
    border-right:4px solid #3498db;
    padding:15px;
    line-height:2;
    margin-bottom:25px;

}



.content{

    line-height:2.2;
    font-size:16px;
    color:#444;

}


.content h2{

    color:#34495e;
    margin-top:30px;

}



.tags{

    margin-top:30px;

}


.tag{

    display:inline-block;
    background:#3498db;
    color:white;
    padding:6px 15px;
    border-radius:20px;
    margin-left:5px;
    font-size:13px;

}



.author{

    margin-top:30px;
    padding-top:20px;
    border-top:1px solid #eee;
    color:#777;

}



.related{

    margin-top:40px;

}


.related-item{

    background:#f8f9fa;
    padding:15px;
    margin-bottom:10px;
    border-radius:8px;

}


.related-item a{

    text-decoration:none;
    color:#2980b9;

}

.btn{

    display:inline-block;
    background:#3498db;
    color:#fff;
    padding:10px 18px;
    border-radius:5px;
    text-decoration:none;

}

.btn:hover{

    background:#2980b9;
    color:#fff;

}

.back-link{

    margin-top:25px;

}


</style>

</head>


<body>


<div class="container">

<div id="view">

</div>

</div>


<script src="../assets/js/articles.js"></script>
<script>
    var params = new URLSearchParams(window.location.search);
    var article = ArticleStore.getArticle(params.get('id'));
    var view = document.getElementById('view');

    if (!article) {

        view.innerHTML =
            '<h1 class="title">مقاله پیدا نشد</h1>' +
            '<p>مقاله مورد نظر شما وجود ندارد یا حذف شده است.</p>' +
            '<a class="btn back-link" href="ArticleList.html">بازگشت به لیست مقالات</a>';

    } else {

        var others = ArticleStore.getArticles().filter(function (x) {
            return String(x.id) !== String(article.id);
        }).slice(0, 2);

        var related = others.map(function (x) {
            return '<div class="related-item"><a href="Article.html?id=' + x.id + '">' + x.title + '</a></div>';
        }).join('');

        var tags = (article.tags || []).map(function (t) {
            return '<span class="tag">' + t + '</span>';
        }).join('');

        view.innerHTML =
            '<h1 class="title">' + article.title + '</h1>' +

            '<div class="meta">' +
                'نویسنده: ' + article.author + ' | ' +
                'تاریخ انتشار: ' + article.date + ' | ' +
                'دسته‌بندی: ' + article.category +
            '</div>' +

            '<img class="cover" src="' + article.image + '" alt="تصویر مقاله">' +

            '<div class="summary">' + article.summary + '</div>' +

            '<div class="content">' + article.content + '</div>' +

            '<div class="tags"><strong>برچسب‌ها:</strong> ' + tags + '</div>' +

            '<div class="author">نوشته شده توسط: ' + article.author + '</div>' +

            '<div class="related">' +
                '<h2>مقالات مرتبط</h2>' +
                (related || '<p>مقاله دیگری وجود ندارد.</p>') +
            '</div>' +

            '<a class="btn back-link" href="ArticleList.html">بازگشت به لیست مقالات</a>';

    }
</script>


</body>

</html>
