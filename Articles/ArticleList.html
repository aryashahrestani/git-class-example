<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقالات</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Tahoma, sans-serif;
        }

        body{
            background:#f5f6fa;
            color:#333;
        }

        .container{
            width:90%;
            max-width:1100px;
            margin:40px auto;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#2c3e50;
        }

        .article{
            display:flex;
            gap:20px;
            background:#fff;
            margin-bottom:20px;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
            transition:.3s;
        }

        .article:hover{
            transform:translateY(-3px);
            box-shadow:0 6px 18px rgba(0,0,0,.15);
        }

        .article img{
            width:240px;
            height:170px;
            object-fit:cover;
        }

        .content{
            padding:20px;
            flex:1;
        }

        .content h2{
            margin-bottom:10px;
            color:#34495e;
        }

        .meta{
            font-size:13px;
            color:#888;
            margin-bottom:12px;
        }

        .content p{
            line-height:1.8;
            margin-bottom:15px;
        }

        .btn{
            display:inline-block;
            background:#3498db;
            color:#fff;
            padding:10px 18px;
            border-radius:5px;
            text-decoration:none;
            transition:.3s;
        }

        .btn:hover{
            background:#2980b9;
        }

        @media(max-width:768px){

            .article{
                flex-direction:column;
            }

            .article img{
                width:100%;
                height:220px;
            }

        }
    </style>

</head>
<body>

<div class="container">

    <h1>آخرین مقالات</h1>

    <div style="text-align:center; margin-bottom:25px;">
        <a href="AddArticle.html" class="btn" style="background:#27ae60;">+ ایجاد مقاله جدید</a>
        <a href="../index.html" class="btn" style="background:#95a5a6;">بازگشت به خانه</a>
    </div>

    <div id="list"></div>

    <p id="empty" style="text-align:center; color:#888; display:none;">
        هنوز مقاله‌ای وجود ندارد. اولین مقاله را ایجاد کنید!
    </p>

</div>

<script src="../assets/js/articles.js"></script>
<script>
    var box = document.getElementById('list');
    var items = ArticleStore.getArticles();

    if (!items.length) {
        document.getElementById('empty').style.display = 'block';
    }

    var html = '';
    items.forEach(function (a) {
        html += '<div class="article">' +
            '<img src="' + a.image + '" alt="">' +
            '<div class="content">' +
                '<h2>' + a.title + '</h2>' +
                '<div class="meta">' + a.date + ' | دسته‌بندی: ' + a.category +
                    (a.status === 'پیش نویس' ? ' | وضعیت: ' + a.status : '') +
                '</div>' +
                '<p>' + a.summary + '</p>' +
                '<a href="Article.html?id=' + a.id + '" class="btn">ادامه مطلب</a>' +
            '</div>' +
        '</div>';
    });

    box.innerHTML = html;
</script>

</body>
</html>
