name: "Link Checker"

on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  links:
    name: Check Broken Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress .
          fail: true
