<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | سایت نمونه</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="admin">

<header id="site-nav"></header>

<main>
    <div class="container" style="margin-top:45px;">

        <div class="login-box" id="login-view">
            <div class="paper">
                <h1>ورود به پنل مدیریت</h1>
                <div class="form-group">
                    <label>نام کاربری</label>
                    <input id="login-user" type="text" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input id="login-pass" type="password" placeholder="••••••••">
                </div>
                <button class="btn" onclick="login()" style="width:100%;">ورود</button>
                <div id="login-err"></div>
                <p style="margin-top:15px; font-size:12px; color:#888; text-align:center;">
                    نسخه نمایشی — نام کاربری: admin | رمز عبور: admin123
                </p>
            </div>
        </div>

        <div id="dash-view" class="hidden">

            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:25px;">
                <h1 style="color:#2c3e50;">پنل مدیریت مقالات</h1>
                <div>
                    <a href="../Articles/AddArticle.html" class="btn btn-green">+ مقاله جدید</a>
                    <button class="btn btn-gray" onclick="logout()">خروج</button>
                </div>
            </div>

            <div class="stat-row" style="margin-bottom:30px;">
                <div class="stat"><b id="stat-all">0</b><span>کل مقالات</span></div>
                <div class="stat"><b id="stat-pub">0</b><span>منتشر شده</span></div>
                <div class="stat"><b id="stat-draft">0</b><span>پیش نویس</span></div>
                <div class="stat"><b id="stat-msg">0</b><span>پیام‌های دریافتی</span></div>
            </div>

            <div class="table-wrap" style="margin-bottom:40px;">
                <table>
                    <thead>
                        <tr>
                            <th>عنوان</th>
                            <th>دسته‌بندی</th>
                            <th>وضعیت</th>
                            <th>تاریخ</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="article-rows"></tbody>
                </table>
            </div>

            <h2 style="color:#2c3e50; margin-bottom:15px;">پیام‌های تماس</h2>
            <div id="msg-list"></div>

        </div>

    </div>
</main>

<footer id="site-footer"></footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/articles.js"></script>
<script>

    var ADMIN_KEY = 'mywebsite_admin_logged';

    function login() {
        var u = document.getElementById('login-user').value.trim();
        var p = document.getElementById('login-pass').value.trim();
        var err = document.getElementById('login-err');

        if (u === 'admin' && p === 'admin123') {
            localStorage.setItem(ADMIN_KEY, '1');
            err.className = 'alert-error hidden';
            showDash();
        } else {
            err.className = 'alert-error';
            err.textContent = 'نام کاربری یا رمز عبور اشتباه است.';
        }
    }

    function logout() {
        localStorage.removeItem(ADMIN_KEY);
        location.reload();
    }

    function renderArticles() {
        var items = ArticleStore.getArticles();
        var rows = document.getElementById('article-rows');

        document.getElementById('stat-all').textContent = items.length;
        document.getElementById('stat-pub').textContent = items.filter(function (a) { return a.status !== 'پیش نویس'; }).length;
        document.getElementById('stat-draft').textContent = items.filter(function (a) { return a.status === 'پیش نویس'; }).length;

        rows.innerHTML = items.map(function (a) {
            var badge = a.status === 'پیش نویس' ? 'badge-draft' : 'badge-pub';
            return '<tr>' +
                '<td>' + a.title + '</td>' +
                '<td>' + a.category + '</td>' +
                '<td><span class="badge ' + badge + '">' + a.status + '</span></td>' +
                '<td>' + a.date + '</td>' +
                '<td>' +
                    '<button class="btn" onclick="toggleStatus(' + a.id + ')">' +
                        (a.status === 'پیش نویس' ? 'انتشار' : 'پیش نویس') + '</button> ' +
                    '<a class="btn btn-gray" href="../Articles/AddArticle.html?id=' + a.id + '">ویرایش</a> ' +
                    '<button class="btn btn-red" onclick="removeArticle(' + a.id + ')">حذف</button>' +
                '</td>' +
            '</tr>';
        }).join('');

        if (!items.length) {
            rows.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">مقاله‌ای وجود ندارد.</td></tr>';
        }
    }

    function renderMessages() {
        var msgs = SiteMessages.getAll();
        var box = document.getElementById('msg-list');
        document.getElementById('stat-msg').textContent = msgs.length;

        box.innerHTML = msgs.map(function (m) {
            return '<div class="paper" style="margin-bottom:15px; padding:20px;">' +
                '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
                    '<div>' +
                        '<b>' + m.name + '</b>' +
                        '<span style="color:#888; font-size:13px;"> (' + m.email + ')</span>' +
                    '</div>' +
                    '<div>' +
                        '<span style="color:#888; font-size:12px; margin-left:10px;">' + m.date + '</span>' +
                        '<button class="btn btn-red" onclick="removeMessage(' + m.id + ')">حذف</button>' +
                    '</div>' +
                '</div>' +
                '<p style="margin-top:10px; line-height:1.9; font-size:14px;">' +
                    (m.subject ? '<b>موضوع: ' + m.subject + '</b><br>' : '') + m.message +
                '</p>' +
            '</div>';
        }).join('');

        if (!msgs.length) {
            box.innerHTML = '<p style="color:#888; text-align:center;">پیامی دریافت نشده است.</p>';
        }
    }

    function toggleStatus(id) {
        var a = ArticleStore.getArticle(id);
        a.status = a.status === 'پیش نویس' ? 'منتشر شده' : 'پیش نویس';
        ArticleStore.updateArticle(a);
        renderArticles();
    }

    function removeArticle(id) {
        if (confirm('این مقاله حذف شود؟')) {
            ArticleStore.deleteArticle(id);
            renderArticles();
        }
    }

    function removeMessage(id) {
        SiteMessages.remove(id);
        renderMessages();
    }

    function showDash() {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('dash-view').classList.remove('hidden');
        renderArticles();
        renderMessages();
    }

    if (localStorage.getItem(ADMIN_KEY) === '1') {
        showDash();
    }

</script>

</body>
</html>
